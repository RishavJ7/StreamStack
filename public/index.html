<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamStack — Video & Tweet Platform</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ==================== HEADER ==================== -->
  <header>
    <div class="logo-container" onclick="switchTab('home')">
      <div class="logo-icon">&#9654;</div>
      <div class="logo-text">Stream<span>Stack</span></div>
    </div>

    <div class="search-bar-container">
      <div class="search-input-wrapper">
        <input type="text" id="search-input" class="search-input" placeholder="Search videos by title or topic..." />
        <button class="search-btn" onclick="loadVideos(document.getElementById('search-input').value)">
          <svg style="width: 18px; height: 18px; fill: currentColor;" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        </button>
      </div>
    </div>

    <div class="header-actions">
      <button class="btn btn-secondary" onclick="openUploadModal()">
        <span>+ Upload</span>
      </button>
      <div id="header-auth-section">
        <button class="btn btn-blue" onclick="openModal('auth-modal')">Sign In</button>
      </div>
    </div>
  </header>

  <!-- ==================== MAIN WRAPPER ==================== -->
  <div class="main-wrapper">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <a class="nav-item active" data-tab="home" onclick="switchTab('home')">
        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span>Home</span>
      </a>
      <a class="nav-item" data-tab="tweets" onclick="switchTab('tweets')">
        <svg viewBox="0 0 24 24"><path d="M23 3a10.9 10.9 0 0 1-3.14 1.53 4.48 4.48 0 0 0-7.86 3v1A10.66 10.66 0 0 1 3 4s-4 9 5 13a11.64 11.64 0 0 1-7 2c9 5 20 0 20-11.5a4.5 4.5 0 0 0-.08-.83A7.72 7.72 0 0 0 23 3z"/></svg>
        <span>Tweets</span>
      </a>
      <a class="nav-item" data-tab="liked" onclick="switchTab('liked')">
        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
        <span>Liked Videos</span>
      </a>
      <a class="nav-item" data-tab="history" onclick="switchTab('history')">
        <svg viewBox="0 0 24 24"><path d="M13 3a9 9 0 0 0-9 9H1l3.89 3.89.07.14L9 12H6c0-3.87 3.13-7 7-7s7 3.13 7 7-3.13 7-7 7c-1.93 0-3.68-.79-4.94-2.06l-1.42 1.42A8.954 8.954 0 0 0 13 21a9 9 0 0 0 0-18zm-1 5v5l4.28 2.54.72-1.21-3.5-2.08V8H12z"/></svg>
        <span>History</span>
      </a>
    </aside>

    <!-- Content Area -->
    <main class="content-area">
      <!-- 1. Home / Video Feed View -->
      <section id="home-view">
        <div id="video-grid" class="video-grid">
          <!-- Populated by JavaScript -->
        </div>
      </section>

      <!-- 2. Watch / Video Player View -->
      <section id="watch-view" style="display: none;">
        <!-- Populated by JavaScript -->
      </section>

      <!-- 3. Tweets View -->
      <section id="tweets-view" style="display: none;">
        <div class="tweets-container">
          <div class="tweet-compose-box">
            <textarea id="tweet-compose-text" class="tweet-textarea" placeholder="What's happening in your stream?"></textarea>
            <div class="tweet-compose-footer">
              <button class="btn btn-blue" onclick="postTweet()">Post Tweet</button>
            </div>
          </div>
          <div id="tweets-feed">
            <!-- Populated by JavaScript -->
          </div>
        </div>
      </section>

      <!-- 4. Liked Videos View -->
      <section id="liked-view" style="display: none;">
        <h2 style="margin-bottom: 20px; font-size: 1.4rem;">Liked Videos</h2>
        <div id="liked-list"></div>
      </section>

      <!-- 5. Watch History View -->
      <section id="history-view" style="display: none;">
        <h2 style="margin-bottom: 20px; font-size: 1.4rem;">Watch History</h2>
        <div id="history-list"></div>
      </section>
    </main>
  </div>

  <!-- ==================== MODALS ==================== -->

  <!-- Auth Modal (Login / Register) -->
  <div id="auth-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">Account Access</div>
        <button class="modal-close-btn" onclick="closeModal('auth-modal')">&times;</button>
      </div>

      <div class="modal-tabs">
        <div id="auth-tab-login" class="modal-tab active" onclick="switchAuthTab('login')">Sign In</div>
        <div id="auth-tab-register" class="modal-tab" onclick="switchAuthTab('register')">Create Account</div>
      </div>

      <!-- Login Form -->
      <form id="login-form" onsubmit="event.preventDefault(); login(document.getElementById('login-username').value, document.getElementById('login-password').value);">
        <div class="form-group">
          <label class="form-label">Username or Email</label>
          <input type="text" id="login-username" class="form-input" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" id="login-password" class="form-input" required />
        </div>
        <button type="submit" class="btn btn-blue" style="width: 100%; margin-top: 8px;">Sign In</button>
      </form>

      <!-- Register Form -->
      <form id="register-form" style="display: none;" onsubmit="event.preventDefault(); register(new FormData(this));">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <input type="text" name="fullName" class="form-input" required />
        </div>
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-input" required />
        </div>
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" name="email" class="form-input" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-input" required />
        </div>
        <div class="form-group">
          <label class="form-label">Avatar Image</label>
          <input type="file" name="avatar" class="form-input" accept="image/*" required />
        </div>
        <div class="form-group">
          <label class="form-label">Cover Image (Optional)</label>
          <input type="file" name="coverImage" class="form-input" accept="image/*" />
        </div>
        <button type="submit" class="btn btn-blue" style="width: 100%; margin-top: 8px;">Register</button>
      </form>
    </div>
  </div>

  <!-- Upload Video Modal -->
  <div id="upload-modal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <div class="modal-title">Upload Video</div>
        <button class="modal-close-btn" onclick="closeModal('upload-modal')">&times;</button>
      </div>

      <form id="upload-video-form" onsubmit="handleVideoUpload(event)">
        <div class="form-group">
          <label class="form-label">Video Title</label>
          <input type="text" name="title" class="form-input" placeholder="e.g. Building an AI Assistant with Node.js" required />
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea name="description" class="form-input" style="min-height: 80px; resize: vertical;" placeholder="Tell viewers about your video..." required></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Video File (MP4, WebM)</label>
          <input type="file" name="videoFile" class="form-input" accept="video/*" required />
        </div>
        <div class="form-group">
          <label class="form-label">Thumbnail Image (JPG, PNG)</label>
          <input type="file" name="thumbnail" class="form-input" accept="image/*" required />
        </div>
        <button type="submit" id="upload-submit-btn" class="btn btn-blue" style="width: 100%; margin-top: 12px;">Publish Video</button>
      </form>
    </div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" class="toast-container"></div>

  <script src="/app.js"></script>
</body>
</html>
